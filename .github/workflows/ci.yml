name: CI

on:
  pull_request:
  push:
    branches: [Matisse, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run audit:secrets
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Validate production environment contract
        run: node scripts/validate-env.mjs
        env:
          SUPABASE_URL: https://ci-only.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-only-service-role-value-long-enough
          ADMIN_PASSWORD: ci-only-strong-admin-password
          ADMIN_SECRET: ci-only-admin-secret-32-characters-minimum-value
          ADMIN_SESSION_VERSION: ci
          RATE_LIMIT_SECRET: ci-only-rate-limit-secret-32-characters-value
          MARKETING_UNSUBSCRIBE_SECRET: ci-only-marketing-secret-32-characters-value
          CRON_SECRET: ci-only-cron-secret-24-characters-value
          RESEND_API_KEY: ci-only-resend-key-value
          EMAIL_FROM: PHENO CI <noreply@example.test>
          NEXT_PUBLIC_SITE_URL: https://example.test
          TRUST_PROXY: "false"
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-real-secret
          ADMIN_PASSWORD: ci-placeholder-password
          ADMIN_SECRET: ci-placeholder-secret-at-least-thirty-two-characters
          RATE_LIMIT_SECRET: ci-placeholder-rate-limit-secret-thirty-two-chars
          NEXT_PUBLIC_SITE_URL: https://phenoandco.fr
